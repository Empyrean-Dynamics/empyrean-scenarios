name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Python lint — ruff format + check across every .py in the repo.
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  # Rust lint + build — `cargo fmt --check` and `cargo build` for the
  # full workspace (every scenario binary). Doesn't run the binaries
  # because they need network + SPICE kernels; the smoke job below
  # handles end-to-end verification once the kernel cache is wired
  # into CI.
  lint-rust:
    name: Lint + Build (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Smoke-test pass — verifies the Python package installs cleanly,
  # and that every scenario's `main.py` is syntactically valid +
  # imports resolve. Full end-to-end execution waits on SPICE kernel
  # caching being wired into CI; once that lands, this job will also
  # run each script against a fixed reference epoch.
  #
  # The `spielberg:snippet:start/end` regions in these scripts feed
  # the explore-mode "Reproduce in Python" panel directly via
  # spielberg's snippet extractor (single source of truth). Catching
  # syntax / import breakage here is the minimum bar for that panel
  # to remain runnable.
  smoke:
    name: Smoke (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Scenarios target requires-python >= 3.10, so validate the runnable
      # walkthroughs across the supported range — a 3.10-incompatible construct
      # in a scenario script would otherwise pass a single-version smoke.
      # `pip install -e .` pulls the published empyrean wheel, which covers 3.10+
      # via its abi3 build; this matrix is fully green once empyrean ships abi3
      # wheels (before that, only 3.12 has an installable wheel).
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: pip install -e .
      - name: py_compile all scenario scripts
        run: |
          set -e
          for f in 99942_Apophis 101955_Bennu 2008_TC3 2020_CD3 2024_YR4 67P_Churyumov-Gerasimenko; do
            echo "py_compile: $f/main.py"
            python -m py_compile "$f/main.py"
          done

      - name: py_compile all install-page reference scripts
        run: |
          set -e
          for f in install-page/*.py; do
            echo "py_compile: $f"
            python -m py_compile "$f"
          done
