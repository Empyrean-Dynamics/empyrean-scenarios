name: Scenario problem or proposal
description: A problem with one of the demonstration scenarios, on the website or in the empyrean-scenarios repository, or a proposal for a new one.
title: "[scenario]: "
labels: ["scenario", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The scenarios run on the website at https://empyrean-dynamics.com and as
        Python and Rust programs in this repository. Use this form for a
        problem you hit or a scenario you propose; for an open question about
        a scenario, start a
        [discussion](https://github.com/Empyrean-Dynamics/empyrean/discussions/categories/q-a)
        tagged scenario. A wrong number that reproduces outside the scenarios
        is a bug in [empyrean](https://github.com/Empyrean-Dynamics/empyrean/issues/new/choose).

  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      options:
        - 99942 Apophis (2029 close approach)
        - 2024 YR4 (2032 encounter, including the orbit determination steps)
        - 2008 TC3 (atmospheric entry and impact)
        - 2020 CD3 (temporary capture)
        - 67P/Churyumov-Gerasimenko (non-gravitational forces)
        - 101955 Bennu (long propagation)
        - Artemis II (thrust arcs)
        - Proposal for a new scenario
        - Other
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where you ran it
      options:
        - Website demonstration
        - empyrean-scenarios, Python
        - empyrean-scenarios, Rust
        - Not run yet (proposal)
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, or what you propose
      description: For a problem, what you saw and what you expected; for a proposal, the object, the event and why it is instructive.
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version output
      description: Optional for the website (the version popover at the bottom right of the page lists every package); for the repository, `empyrean --version` or the Python version string.
      render: text
