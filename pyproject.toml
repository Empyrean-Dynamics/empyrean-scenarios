[project]
name = "empyrean-scenarios"
version = "0.10.0rc1"
description = "Runnable Python walkthroughs of the explore-mode planetary-science scenarios on empyrean-dynamics.com."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Joachim Moeyens", email = "joachim@empyrean-dynamics.com" },
]
keywords = ["astrodynamics", "planetary-science", "near-earth-objects", "examples", "ephemeris"]

# These scripts are walkthroughs of the explore-mode scenarios on
# empyrean-dynamics.com — they don't ship as a library, just as a
# collection of `python <script>.py` runnable demos. Each script
# imports only from the public `empyrean` API surface.
dependencies = [
    "empyrean==0.10.0rc1",
    "numpy>=1.21",
    # The install-page Epochs walkthrough demonstrates Astropy interop.
    "astropy>=6",
]

# Execute the notebook twins headlessly (CI and local re-runs):
#   pip install -e '.[notebooks]'
[project.optional-dependencies]
notebooks = ["nbformat>=5", "nbclient>=0.9", "ipykernel>=6"]

# Not an importable package — installing this project just provisions
# the dependency set above. Without this, setuptools' flat-layout
# auto-discovery trips over local run artifacts (target/, downloaded
# ephemeris directories) and refuses to build.
[tool.setuptools]
packages = []
